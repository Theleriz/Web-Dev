<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="boxTitle">TO-DO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">
    <div class="container">
        <h1 >My To-Do List</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." />
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filter-buttons">
            <button id="view-active-task">View Active Tasks</button>
            <button id="view-completed-task">View Completed Tasks</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>

<div class="albums-container">
  <h1>All Albums</h1>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading albums...</p>
  </div>

  <div *ngIf="!loading && albums.length === 0" class="empty">
    <p>No albums found.</p>
  </div>

  <div *ngIf="!loading" class="albums-grid">
    <div *ngFor="let album of albums" class="album-card" (click)="goToDetail(album.id)">
      <div class="album-id">#{{ album.id }}</div>
      <div class="album-title">{{ album.title }}</div>
      <div class="album-footer">
        <span class="user-badge">User {{ album.userId }}</span>
        <button class="btn-delete" (click)="deleteAlbum($event, album.id)">Delete</button>
      </div>
    </div>
  </div>
</div>

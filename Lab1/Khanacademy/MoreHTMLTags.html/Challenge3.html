<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>

        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Steak</td>
                    <td>Meat, salt, papper</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Apple cake</td>
                    <td>apple, dough, sugar, etc</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Cream soup</td>
                    <td>tomate, salt, black paper, etc</td>
                    <td>5</td>
                </tr>
            </tbody>
        </table>

    </body>
</html>

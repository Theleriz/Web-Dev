<div class="cats">
  <button 
    class="cat" 
    [class.active]="activeCategory === 'All'" 
    (click)="selectCategory('All')">
    All
  </button>

  @for (c of categories; track c) {
    <button
      class="cat"
      [class.active]="activeCategory === c"
      (click)="selectCategory(c)">
      {{ c }}
    </button>
  }
</div>

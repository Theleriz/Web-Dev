<h2 class="heading">Kaspi Store</h2>

<button (click)="sortProducts(true)">ascending</button>
<button (click)="sortProducts(false)">descending</button>

@if (filteredProducts.length === 0) {
  <p class="empty">No products found.</p>
}

<div class="grid">
  @for (p of filteredProducts; track p.id) {
    <app-product-item [product]="p" />
  }
</div>
